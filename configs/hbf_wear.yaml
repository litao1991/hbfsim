device:
  stacks: 1

nand:
  dies_per_stack: 1
  planes_per_die: 2
  blocks_per_plane: 8
  pages_per_block: 4
  page_size: 4KiB
  timing:
    read_ns: 1us
    program_ns: 5us
    erase_ns: 10us
  parallelism:
    max_active_planes_per_die: 2
    max_active_planes_per_stack: 2
  reliability:
    program_failure_rate: 0
    program_failure_rate_per_erase: 0.000001
    erase_failure_rate: 0
    erase_failure_rate_per_erase: 0.0000001
    raw_bit_error_rate: 0.000000001
    raw_bit_error_rate_per_erase: 0.000000000001
    retry_ber_multiplier: 0.25
    ecc_correctable_bits: 8
    max_read_retries: 2
    max_erase_cycles: 3000
    random_seed: 1

host_interface:
  channels_per_stack: 2
  bandwidth_per_channel: 100GBps
  fixed_latency_ns: 10

internal_fabric:
  ports_per_stack: 2
  aggregate_bandwidth: 100GBps
  port_bandwidth: 64GBps
  fixed_latency_ns: 10

mapping:
  policy: host_managed

host_gc:
  enabled: true
  low_watermark: 20%
  high_watermark: 40%
  overprovisioning_ratio: 25%

statistics:
  output_dir: results/wear
